plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
}

repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
	implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
	implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-logging'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'jdk.net.hosts.file', file('src/test/resources/blade.hosts').absolutePath
}
