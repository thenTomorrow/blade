spring.application.name=blade-api-gateway
blade.jwt.issuer=${BLADE_JWT_ISSUER:blade-auth}
blade.jwt.public-key=file:${BLADE_JWT_PUBLIC_KEY_FILE:../.secrets/jwt.pem}
blade.routes.auth=${BLADE_AUTH_URI:http://blade-auth:8080}
blade.discovery.dns-prefix=${BLADE_DNS_PREFIX:tasks.}
blade.discovery.port=${BLADE_SERVICE_PORT:8080}
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s
