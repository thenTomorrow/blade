spring.application.name=blade-auth
blade.jwt.issuer=${BLADE_JWT_ISSUER:blade-auth}
blade.jwt.public-key=file:${BLADE_JWT_PUBLIC_KEY_FILE:../.secrets/jwt.pem}
blade.jwt.private-key=file:${BLADE_JWT_PRIVATE_KEY_FILE:../.secrets/jwt.key}
spring.datasource.url=${BLADE_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/blade}
spring.datasource.username=${BLADE_DATASOURCE_USERNAME:blade_auth}
spring.datasource.password=${BLADE_DATASOURCE_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
