spring.application.name=blade-auth
blade.jwt.issuer=${BLADE_JWT_ISSUER:blade-auth}
blade.jwt.public-key=file:${BLADE_JWT_PUBLIC_KEY_FILE:../.secrets/jwt.pem}
blade.jwt.private-key=file:${BLADE_JWT_PRIVATE_KEY_FILE:../.secrets/jwt.key}
blade.auth.password-hash=file:${BLADE_PASSWORD_HASH_FILE:../.secrets/password.bcrypt}
blade.auth.username=${BLADE_AUTH_USERNAME:blade}
blade.auth.user-id=${BLADE_AUTH_USER_ID:51d4db3c-bb6f-423a-b313-7f6f023a2d15}
blade.auth.roles=${BLADE_AUTH_ROLES:USER}
