spring.application.name=blade-auth

blade.jwt.issuer=${BLADE_JWT_ISSUER:blade-auth}
blade.jwt.public-key=file:${BLADE_JWT_PUBLIC_KEY_FILE:../.secrets/jwt.pem}
blade.jwt.private-key=file:${BLADE_JWT_PRIVATE_KEY_FILE:../.secrets/jwt.key}

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/blade?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=blade
spring.datasource.password=blade123
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=blade-auth-pool

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
