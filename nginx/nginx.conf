user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    map $uri $login_limit_key {
        default "";
        /auth/login $binary_remote_addr;
    }
    limit_req_zone $login_limit_key zone=login:10m rate=5r/s;

    upstream blade_gateway {
        zone blade_gateway 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server tasks.blade-api-gateway:8080 resolve;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32k;

        location / {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Roles "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_pass http://blade_gateway;
        }
    }
}
