version: "3.8"

x-java-deploy: &java-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s

services:
  nginx:
    image: ${BLADE_IMAGE_PREFIX:-blade}/nginx:${BLADE_IMAGE_TAG:-local}
    networks: [edge]
    secrets:
      - source: tls_cert
        target: tls_cert
        mode: 0400
      - source: tls_key
        target: tls_key
        mode: 0400
    deploy: *java-deploy

  blade-api-gateway:
    image: ${BLADE_IMAGE_PREFIX:-blade}/blade-api-gateway:${BLADE_IMAGE_TAG:-local}
    networks: [edge, auth, service-a, service-b]
    environment:
      BLADE_JWT_ISSUER: ${BLADE_JWT_ISSUER:-blade-auth}
      BLADE_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    secrets:
      - source: jwt_public_key
        target: jwt_public_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    deploy: *java-deploy

  blade-auth:
    image: ${BLADE_IMAGE_PREFIX:-blade}/blade-auth:${BLADE_IMAGE_TAG:-local}
    networks: [auth, auth-db]
    environment:
      BLADE_JWT_ISSUER: ${BLADE_JWT_ISSUER:-blade-auth}
      BLADE_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      BLADE_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      BLADE_DATASOURCE_URL: ${BLADE_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/blade}
      BLADE_DATASOURCE_USERNAME: ${BLADE_DATASOURCE_USERNAME:-blade_auth}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: jwt_public_key
        target: jwt_public_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: jwt_private_key
        target: jwt_private_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: mysql_password
        target: spring.datasource.password
        uid: "10001"
        gid: "10001"
        mode: 0400
    deploy: *java-deploy

  blade-service-a:
    image: ${BLADE_IMAGE_PREFIX:-blade}/blade-service-a:${BLADE_IMAGE_TAG:-local}
    networks: [service-a]
    deploy: *java-deploy

  blade-service-b:
    image: ${BLADE_IMAGE_PREFIX:-blade}/blade-service-b:${BLADE_IMAGE_TAG:-local}
    networks: [service-b]
    deploy: *java-deploy

networks:
  edge:
    driver: overlay
  auth:
    driver: overlay
    internal: true
  auth-db:
    driver: overlay
  service-a:
    driver: overlay
    internal: true
  service-b:
    driver: overlay
    internal: true

secrets:
  tls_cert:
    external: true
    name: ${BLADE_TLS_CERT_SECRET:-blade_tls_cert}
  tls_key:
    external: true
    name: ${BLADE_TLS_KEY_SECRET:-blade_tls_key}
  jwt_private_key:
    external: true
    name: ${BLADE_JWT_PRIVATE_SECRET:-blade_jwt_private_key}
  jwt_public_key:
    external: true
    name: ${BLADE_JWT_PUBLIC_SECRET:-blade_jwt_public_key}
  mysql_password:
    external: true
    name: ${BLADE_MYSQL_PASSWORD_SECRET:-blade_mysql_password}
